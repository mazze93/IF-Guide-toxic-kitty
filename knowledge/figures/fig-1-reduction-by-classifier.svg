<text x='330.0' y='290.0' font-size='12' fill='#111827' text-anchor='start' font-weight='normal'>1.22x ToxiGen  (keeps 95% of the Detoxify figure)</text>
<line x1='300.0' y1='52.0' x2='300.0' y2='302.0' stroke='#6b7280' stroke-dasharray='3 3'/>
<text x='300.0' y='318.0' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>1x = no reduction</text>
<text x='20.0' y='338.0' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>Source: Paper v3, Tables 1 and 2, Pythia-1B, full-prompt EMT (tables/main_results.tex, tables/implicit_toxicity_results.tex)</text>
