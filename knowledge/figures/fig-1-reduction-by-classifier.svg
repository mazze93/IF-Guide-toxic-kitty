<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 350' width='900' height='350' role='img' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<title>Figure 1. The reduction shrinks under ToxiGen for the strong methods, not only IF-Guide</title>
<desc>Bar chart of EMT reduction against the undefended Pythia-1B, under Detoxify and under ToxiGen, for five methods.</desc>
<rect x='0.0' y='0.0' width='900.0' height='350.0' fill='#ffffff'/>
<text x='20.0' y='28.0' font-size='15' fill='#111827' text-anchor='start' font-weight='600'>Figure 1. The reduction shrinks under ToxiGen for the strong methods, not only IF-Guide</text>
<text x='180.0' y='82.0' font-size='13' fill='#111827' text-anchor='end' font-weight='600'>IF-Guide</text>
<rect x='190.0' y='60.0' width='545.3' height='15.0' fill='#1f5fa8'/>
<text x='741.3' y='72.0' font-size='12' fill='#111827' text-anchor='start' font-weight='normal'>4.96x Detoxify</text>
<rect x='190.0' y='78.0' width='246.0' height='15.0' fill='#b4530f'/>
<text x='442.0' y='90.0' font-size='12' fill='#111827' text-anchor='start' font-weight='normal'>2.24x ToxiGen  (keeps 45% of the Detoxify figure)</text>
<text x='180.0' y='132.0' font-size='13' fill='#111827' text-anchor='end' font-weight='600'>RAD</text>
<rect x='190.0' y='110.0' width='397.2' height='15.0' fill='#1f5fa8'/>
<text x='593.2' y='122.0' font-size='12' fill='#111827' text-anchor='start' font-weight='normal'>3.61x Detoxify</text>
<rect x='190.0' y='128.0' width='210.8' height='15.0' fill='#b4530f'/>
<text x='406.8' y='140.0' font-size='12' fill='#111827' text-anchor='start' font-weight='normal'>1.92x ToxiGen  (keeps 53% of the Detoxify figure)</text>
<text x='180.0' y='182.0' font-size='13' fill='#111827' text-anchor='end' font-weight='600'>Toxicity Filtering</text>
<rect x='190.0' y='160.0' width='171.6' height='15.0' fill='#1f5fa8'/>
<text x='367.6' y='172.0' font-size='12' fill='#111827' text-anchor='start' font-weight='normal'>1.56x Detoxify</text>
<rect x='190.0' y='178.0' width='149.2' height='15.0' fill='#b4530f'/>
<text x='345.2' y='190.0' font-size='12' fill='#111827' text-anchor='start' font-weight='normal'>1.36x ToxiGen  (keeps 87% of the Detoxify figure)</text>
<text x='180.0' y='232.0' font-size='13' fill='#111827' text-anchor='end' font-weight='600'>DPO</text>
<rect x='190.0' y='210.0' width='147.3' height='15.0' fill='#1f5fa8'/>
<text x='343.3' y='222.0' font-size='12' fill='#111827' text-anchor='start' font-weight='normal'>1.34x Detoxify</text>
<rect x='190.0' y='228.0' width='150.3' height='15.0' fill='#b4530f'/>
<text x='346.3' y='240.0' font-size='12' fill='#111827' text-anchor='start' font-weight='normal'>1.37x ToxiGen  (keeps 102% of the Detoxify figure)</text>
<text x='180.0' y='282.0' font-size='13' fill='#111827' text-anchor='end' font-weight='600'>Word Filtering</text>
<rect x='190.0' y='260.0' width='140.5' height='15.0' fill='#1f5fa8'/>
<text x='336.5' y='272.0' font-size='12' fill='#111827' text-anchor='start' font-weight='normal'>1.28x Detoxify</text>
