<title>Figure 0. What each claim stands on</title>
<desc>6 claims from the summary with the standing derived by the bearing engine. The headline reduction is inflated because Detoxify both labels the training signal and scores the result: fragile. Any two proxies agree on under 52% of their selected tokens, yet give similar reductions: fragile. The query pool and the test pool share 4,648 RTP records: fragile. Table 11&#x27;s toxic-class accuracies are not counts out of the 100 toxic prompts: fragile. The overlap means in the paper&#x27;s text are not the means of its Table 9: fragile. IF-Guide suppresses toxic generation without removing the ability (the lacuna): gone.</desc>
