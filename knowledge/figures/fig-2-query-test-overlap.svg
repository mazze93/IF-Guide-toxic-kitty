<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 184' width='900' height='184' role='img' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<title>Figure 2. Nearly half the test prompts also shaped the training signal</title>
<desc>4648 of 10000 test prompts (46.5%) also appear among the 84112 query records.</desc>
<rect x='0.0' y='0.0' width='900.0' height='184.0' fill='#ffffff'/>
<text x='20.0' y='28.0' font-size='15' fill='#111827' text-anchor='start' font-weight='600'>Figure 2. Nearly half the test prompts also shaped the training signal</text>
<text x='20.0' y='58.0' font-size='13' fill='#111827' text-anchor='start' font-weight='600'>Test prompts: 10,000</text>
<rect x='20.0' y='68.0' width='399.7' height='34.0' fill='#b4530f'/>
<rect x='419.7' y='68.0' width='460.3' height='34.0' fill='#1f5fa8'/>
<text x='28.0' y='90.0' font-size='13' fill='#ffffff' text-anchor='start' font-weight='600'>4,648 also in the query pool (46.5%)</text>
<text x='427.7' y='90.0' font-size='13' fill='#ffffff' text-anchor='start' font-weight='600'>5,352 only in the test pool</text>
<text x='20.0' y='128.0' font-size='12' fill='#111827' text-anchor='start' font-weight='normal'>Query pool: 84,112 records. 5.5% of it is test prompts.</text>
<text x='20.0' y='148.0' font-size='12' fill='#111827' text-anchor='start' font-weight='normal'>No record carries the same label in both pools; the thresholds differ (0.75 / 0.25 against 0.5).</text>
<text x='20.0' y='172.0' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>Source: data/RTP index files in this repository; command in summary section 5.D</text>
