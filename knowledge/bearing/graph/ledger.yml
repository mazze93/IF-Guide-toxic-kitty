# Append-only. Never edit an entry; correct with `retract`.
# A frame is an independent source of evidence. A claim is "robust" only when
# two or more counting frames support it. A check that has not been run
# counts for nothing.
frames:
  paper-reported: [paper-table, paper-text]
  repo-computed:  [shipped-data]
  probe-run:      [probe]
  own-reading:
    tags: [own-reading]
    counts: false
    note: "The reviewer's own argument. Recorded, never counted."

epochs:
  - {from: 1, name: "first read"}
  - {from: 9, name: "the overreach"}
  - {from: 11, name: "after three reviews"}

